##################
## Model options
model:
  name: 'MinkUNet34'
  in_feat_size: 1
  out_classes: 10
  out_shape: null
  min_coordinate: null
  

###################
## NPN parameters
npn:
  alpha: 1.0
  beta: 5.0
  warm_up: 0
  topk: 1
  gamma: 0.5             # optional CE loss from original GT 标签
  pseudo_conf_thresh: 0.7
  use_conf_penalty: true
  penalty_weight: 0.05
  debug: true

###################
## Dataset options
dataset_SemKITTI:
  data_path: "/hkfs/work/workspace/scratch/bx6695-exp/KITTI/sequences"
  label_path: "/hkfs/work/workspace/scratch/bx6695-exp/kitti_labels/2%noise"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/semantic-kitti.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 2.
  min_volume_space:
    - -50.
    - -50.
    - -4.
  out_shape:
    - 512
    - 512
    - 32
  min_coordinate:
    - -256
    - -256
    - -21
  voxel_size: 0.2
  beam: 64
  fov: [-23.6, 3.2]

  
dataset_nuScenes:
  data_path: "/hkfs/work/workspace/scratch/bx6695-exp/nuScenes"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/nuscenes.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 3
  min_volume_space:
    - -50.
    - -50.
    - -5
  out_shape:
    - 512
    - 512
    - 48
  min_coordinate:
    - -256
    - -256
    - -29
  voxel_size: 0.2
  beam: 32
  fov: [-30.0, 10.0]

  
dataset_Waymo:
  data_path: "/hkfs/work/workspace/scratch/bx6695-exp/google/extract_lidar"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/waymo.yaml"
  max_volume_space:
    - 75. 
    - 75.
    - 2
  min_volume_space:
    - -75.
    - -75.
    - -4
  out_shape:
    - 768
    - 768
    - 32
  min_coordinate:
    - -384
    - -384
    - -21
  voxel_size: 0.2
  beam: 64
  fov: [-17.6, 2.4]

dataset_SemPOSS:
  data_path: "/hkfs/work/workspace/scratch/bx6695-exp/POSS/sequences"
  ignore_label: 0 
  label_mapping: "./configs/label_mapping/semantic-poss.yaml"
  max_volume_space:
    - 75.
    - 75.
    - 4.
  min_volume_space:
    - -75.
    - -75.
    - -4.
  out_shape:
    - 768
    - 768
    - 48 
  min_coordinate:
    - -384
    - -384
    - -24 
  voxel_size: 0.2
  beam: 40
  fov: [-16.0, 7.0]
  
###################
## Data_loader options
train_dataloader:
  training: True
  batch_size: 4
  shuffle: True
  num_workers: 12
  pin_memory: True
  drop_last: True

val_dataloader:
  training: False
  batch_size: 1
  shuffle: False
  num_workers: 12
  pin_memory: False

test_dataloader:
  training: False
  batch_size: 1
  shuffle: False
  num_workers: 12
  pin_memory: False

###################
## Train params
train_params:
  max_steps: 100000
  learning_rate: 0.001
  criterion_sem: "wce" 
  criterion_const: "L1"
  consistency_loss_weight: 1
  correlation_loss_weight: 10 
  affinity_threshold: 0.707
  use_consistency: True
  use_correlation: True
  use_pretrained: False
  pretrained_ckpt_path: null
  resume_ckpt: null
  
generalization_params:
  source: 'kitti'
  target: ['kitti', 'nuscenes', 'poss']
  use_sparse_aug: True
  positive_num: 1
  beam_sampling: [0.3, 0.7]

#####################
## Experiment Params
exp_params:
  exp_name: "ExpDGLSS"
  log_dir: "Test"
  log_freq: 500

###################
## Test params
test_params:
  target: ['kitti']
  log_dir: "Test"
  save_result: True
  ckpt_path: null

